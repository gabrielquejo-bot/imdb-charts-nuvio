# Leitura semanal das listas do IMDb usando um navegador de verdade.
#
# O IMDb protege /chart/ com AWS WAF em modo challenge: a primeira resposta é
# 202 com ~2 KB de JavaScript, que precisa rodar para liberar o conteúdo. Por
# isso aqui roda Chromium sob xvfb, em modo visível — headless é detectado.
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   ADDON_URL      https://listasimdb.netlify.app
#   REFRESH_TOKEN  o mesmo valor da variável REFRESH_TOKEN na Netlify

name: Atualizar listas do IMDb

on:
  schedule:
    # O IMDb atualiza os rankings de popularidade uma vez por semana, até o
    # fim de segunda. Terça pega o dado novo; sexta é rede de segurança caso
    # a execução de terça falhe.
    - cron: '20 6 * * 2,5' # terça e sexta, 06:20 UTC = 03:20 em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Instalar Playwright e Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Ler o IMDb e enviar ao addon
        env:
          ADDON_URL: ${{ secrets.ADDON_URL }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          if [ -z "$ADDON_URL" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "::error::Faltam os secrets ADDON_URL e REFRESH_TOKEN."
            exit 1
          fi
          xvfb-run --auto-servernum -- node scripts/scrape-browser.mjs --push

      # Commitar o snapshot todo dia mantém o repositório ativo. Sem nenhuma
      # atividade por 60 dias, o GitHub desliga workflows agendados sozinho.
      - name: Guardar o snapshot do dia
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/charts.json
          git diff --staged --quiet || git commit -m "Listas do IMDb de $(date -u +%Y-%m-%d) [skip ci]"
          git push

      - name: Guardar diagnóstico quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: |
            data/
            *.png
          if-no-files-found: ignore
